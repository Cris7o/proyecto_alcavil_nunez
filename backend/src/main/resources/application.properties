spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------------------------------------------------------------------------
# Mensajeria: nombres centralizados
# ---------------------------------------------------------------------------
# Este es el unico lugar del microservicio donde aparece el nombre del topico.
# El codigo Java solo conoce la interfaz PublicadorEventos.
pedido360.mensajeria.topico.nombre=pedido360-eventos-pedido
# ARN completo. Se deja vacio a proposito: incluye el id de cuenta, que cambia
# en cada sesion del Learner Lab, y el publicador lo resuelve solo a partir del
# nombre. Se puede fijar por variable de entorno si se quiere evitar esa llamada.
pedido360.mensajeria.topico.arn=${SNS_TOPICO_ARN:}

spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Streaming (Kinesis Data Streams): nombres y cliente centralizados
# ---------------------------------------------------------------------------
# Unico lugar del servicio de pedidos donde aparecen los streams. El codigo de
# negocio solo conoce PublicadorStreamPedidos y PublicadorStreamActividad.
# La region es la misma de toda la aplicacion (spring.cloud.aws.region.static).
pedido360.streaming.region=${spring.cloud.aws.region.static}
# Ciclo de vida de los pedidos. Clave de particion: pedidoId.
pedido360.streaming.streams.pedidos=pedido360-pedidos
# Interacciones del cliente con el menu. Clave de particion: sesionId.
pedido360.streaming.streams.actividad=pedido360-actividad

# Reintentos del SDK ante errores de red y throttling, y timeouts por llamada.
pedido360.streaming.cliente.max-reintentos-sdk=3
pedido360.streaming.cliente.timeout-llamada-ms=5000
pedido360.streaming.cliente.timeout-intento-ms=2000

# Envio por lote (PutRecords) de la actividad: reintentos de los registros que
# Kinesis rechaza dentro de un lote aceptado (throttling por shard).
pedido360.streaming.lote.max-intentos=3
pedido360.streaming.lote.espera-base-ms=100
pedido360.streaming.lote.max-eventos-por-peticion=100
