spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------------------------------------------------------------------------
# Mensajeria: nombres centralizados
# ---------------------------------------------------------------------------
# Este es el unico lugar del microservicio donde aparece el nombre del topico.
# El codigo Java solo conoce la interfaz PublicadorEventos.
pedido360.mensajeria.topico.nombre=pedido360-eventos-pedido
# ARN completo. Se deja vacio a proposito: incluye el id de cuenta, que cambia
# en cada sesion del Learner Lab, y el publicador lo resuelve solo a partir del
# nombre. Se puede fijar por variable de entorno si se quiere evitar esa llamada.
pedido360.mensajeria.topico.arn=${SNS_TOPICO_ARN:}

spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
