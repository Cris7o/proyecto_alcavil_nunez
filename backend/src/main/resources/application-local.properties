spring.datasource.url=jdbc:h2:file:./data/pedidos360;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sin credenciales de AWS en local: los eventos se registran en el log en lugar
# de publicarse, para poder probar el flujo de pedidos sin nube.
pedido360.mensajeria.habilitada=false
