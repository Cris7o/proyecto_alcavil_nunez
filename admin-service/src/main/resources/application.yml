spring:
  application:
    name: admin-service

server:
  port: ${PORT:8080}

# ===========================================================================
# TOPOLOGIA DE MENSAJERIA DE PEDIDO360
# ===========================================================================
# Este bloque es la fuente de verdad de toda la mensajeria. Nombres, politicas
# de retencion, visibility timeouts, Redrive Policy y filtros de suscripcion
# estan declarados aqui y en ningun otro lugar: ninguna clase Java del proyecto
# tiene un nombre de cola o de topico escrito en el codigo.
#
# POST /admin/topologia aplica todo esto sobre AWS, y es idempotente.
# ===========================================================================
pedido360:
  # -------------------------------------------------------------------------
  # Origenes que pueden operar la mensajeria desde el navegador
  # -------------------------------------------------------------------------
  # El panel de mensajeria del frontend corre en otro puerto, asi que sin esto
  # el navegador bloquearia cada llamada. Se enumeran los origenes en lugar de
  # usar comodin: un comodin dejaria que cualquier pagina abierta operara las
  # colas.
  cors:
    origenes-permitidos:
      - http://localhost:4173    # frontend servido localmente para la demostracion
      - http://localhost:5173    # frontend en modo desarrollo
      - https://pedidos360.netlify.app

  mensajeria:
    region: ${AWS_REGION:us-east-1}

    # Declara la topologia al arrancar. Dejarlo en true hace que reconstruir el
    # entorno despues de un reinicio del laboratorio sea levantar el servicio.
    declarar-al-iniciar: ${DECLARAR_TOPOLOGIA:true}

    # Prefijo con el que se reconocen los recursos del proyecto al listarlos.
    prefijo: pedido360-

    topico:
      nombre: pedido360-eventos-pedido

    # -----------------------------------------------------------------------
    # Instancias del microservicio de consumidores
    # -----------------------------------------------------------------------
    # Las ordenes de pausa y reanudacion se reenvian a todas. Son dos porque la
    # demostracion de disponibilidad levanta dos instancias sobre la misma cola.
    consumidores:
      instancias:
        - http://localhost:8081
        - http://localhost:8082

    # -----------------------------------------------------------------------
    # Las tres colas, una por dominio funcional
    # -----------------------------------------------------------------------
    colas:

      # === 1. NOTIFICACIONES AL CLIENTE ===================================
      - id: notificaciones
        nombre: pedido360-notificaciones
        # 4 dias. Una notificacion de pedido vieja no sirve: avisarle a alguien
        # el viernes que su pedido del lunes esta listo es peor que no avisarle.
        # Pasado ese plazo, el mensaje se descarta solo.
        retencion-segundos: 345600
        # 30 segundos. Enviar un aviso es rapido; si el consumidor no termino en
        # 30 segundos, algo anda mal y conviene que otro lo intente.
        visibilidad-segundos: 30
        # Long polling: el consumidor espera hasta 20 segundos a que haya algo,
        # en lugar de preguntar en vacio. Baja el costo y la latencia.
        espera-larga-segundos: 20
        # Red de seguridad de AWS. El consumidor deriva al tercer intento para
        # poder adjuntar la causa; esto actua solo si el proceso muere antes.
        max-receive-count: 5
        justificacion: >-
          Retencion corta (4 dias) porque el valor de una notificacion caduca.
          Visibility timeout bajo (30 s) porque el envio es una operacion rapida.
        dlq:
          nombre: pedido360-notificaciones-dlq
          # 14 dias, el maximo que permite SQS. Un mensaje que fallo hay que
          # alcanzar a diagnosticarlo, y eso puede tomar dias.
          retencion-segundos: 1209600
          justificacion: >-
            Retencion maxima (14 dias) para tener margen de diagnostico. La
            limpieza es manual, con POST /admin/dlq/notificaciones/purga.
        suscripcion:
          raw-message-delivery: true
          patron: entrega selectiva
          # Solo los eventos que le interesan al cliente final. Los estados
          # intermedios (en preparacion, en reparto) nunca llegan a esta cola.
          filtro:
            tipoEvento:
              - PEDIDO_CREADO
              - PEDIDO_LISTO
              - PEDIDO_ENTREGADO
              - PEDIDO_CANCELADO

      # === 2. DOCUMENTOS: COMANDA Y BOLETA ===============================
      - id: documentos
        nombre: pedido360-documentos
        # 14 dias. Una comanda o una boleta es un documento que hay que emitir
        # igual, aunque el sistema haya estado caido dos semanas.
        retencion-segundos: 1209600
        # 60 segundos. Generar un documento es mas lento que enviar un aviso, y
        # un visibility timeout corto haria que otro consumidor tomara el mismo
        # mensaje mientras el primero todavia lo esta escribiendo.
        visibilidad-segundos: 60
        espera-larga-segundos: 20
        # Mas tolerante que las otras: perder un documento tiene mas costo.
        max-receive-count: 8
        justificacion: >-
          Retencion larga (14 dias) porque el documento hay que emitirlo igual
          pasado el incidente. Visibility timeout de 60 s porque generarlo es
          mas lento que notificar.
        dlq:
          nombre: pedido360-documentos-dlq
          retencion-segundos: 1209600
          justificacion: >-
            Retencion maxima. Es la DLQ mas critica: un documento en la DLQ es
            un documento que el negocio todavia debe emitir, asi que se
            reprocesa antes que purgar.
        suscripcion:
          raw-message-delivery: true
          patron: entrega selectiva
          # Mas estrecho que notificaciones: solo al nacer el pedido (comanda de
          # cocina) y al entregarlo (boleta). Dos filtros distintos sobre el
          # mismo topico es lo que hace de esto entrega selectiva.
          filtro:
            tipoEvento:
              - PEDIDO_CREADO
              - PEDIDO_ENTREGADO

      # === 3. AUDITORIA: BITACORA COMPLETA ===============================
      - id: auditoria
        nombre: pedido360-auditoria
        # 7 dias. Suficiente para revisar un reclamo de la semana; la bitacora
        # de largo plazo no es trabajo de una cola.
        retencion-segundos: 604800
        visibilidad-segundos: 30
        espera-larga-segundos: 20
        max-receive-count: 5
        justificacion: >-
          Retencion intermedia (7 dias) para cubrir reclamos de la semana sin
          acumular indefinidamente. Es la cola que no puede perder eventos,
          pero si puede atrasarse, y por eso esta separada de las otras dos.
        dlq:
          nombre: pedido360-auditoria-dlq
          retencion-segundos: 1209600
          justificacion: >-
            Retencion maxima para poder reconstruir la bitacora completa
            reprocesando lo que haya fallado.
        suscripcion:
          raw-message-delivery: true
          patron: fanout
          # SIN FILTRO. Esta cola recibe absolutamente todos los eventos del
          # topico, y es la que demuestra el patron fanout: cada evento
          # publicado aparece aqui, incluso los que las otras dos descartan.
          filtro: {}

  # =========================================================================
  # STREAMING DE PEDIDO360 (Amazon Kinesis Data Streams)
  # =========================================================================
  # Fuente de verdad de la plataforma de streaming: streams, aplicaciones
  # consumidoras, tabla de estado y alarma. Ninguna clase Java tiene uno de
  # estos nombres o valores escrito. La region es la misma de la mensajeria
  # (pedido360.mensajeria.region): un solo lugar para toda la aplicacion.
  #
  # POST   /admin/streams/topologia   crea o ajusta todo esto en AWS (idempotente)
  # DELETE /admin/streams/topologia   lo elimina (Kinesis cobra por shard y hora)
  #
  # Lo que administra AWS y no el equipo: los servidores, la replicacion de
  # cada registro en tres zonas de disponibilidad antes de confirmar la
  # escritura, y el reemplazo de hardware. Lo que administra el equipo: la
  # cantidad de shards, la retencion, la clave de particion, las aplicaciones
  # consumidoras y sus tablas de coordinacion.
  # =========================================================================
  streaming:
    prefijo: pedido360-

    # No se crea nada al arrancar: los streams se cobran mientras existan, asi
    # que se crean a proposito con POST /admin/streams/topologia (o el script
    # scripts\streaming-crear.bat) y se borran al terminar.
    declarar-al-iniciar: ${DECLARAR_STREAMS:false}

    streams:

      # === 1. PEDIDOS: ciclo de vida de cada pedido =========================
      - id: pedidos
        nombre: pedido360-pedidos
        # Aprovisionado y no On-Demand: On-Demand no permite fijar la cantidad
        # de shards (la escala AWS) y cobra por GB ademas de por hora. Con
        # carga conocida y moderada, aprovisionado es mas barato y predecible.
        modo-capacidad: PROVISIONED
        # 3 shards = hasta 3 MB/s o 3.000 registros/s de escritura y 6 MB/s de
        # lectura compartida. El volumen de pedidos esta muy por debajo; los 3
        # shards dan paralelismo: hasta 3 instancias por aplicacion consumidora
        # procesando a la vez, y la caida de una no detiene el stream.
        shards: 3
        # 24 horas. En produccion seria 168 (7 dias): los pedidos son el flujo
        # de mayor valor, una aplicacion nueva podria releer la semana desde
        # TRIM_HORIZON y un consumidor caido el fin de semana no perderia nada.
        # El Learner Lab de AWS Academy lo impide: una politica de la
        # organizacion (SCP) deniega kinesis:IncreaseStreamRetentionPeriod, asi
        # que 24 h (el minimo) es el unico valor posible aqui. El administrador
        # si implementa el cambio de retencion; en una cuenta normal funciona.
        retencion-horas: 24
        clave-particion: pedidoId
        # Metricas por shard (de pago): permiten ver la distribucion de la
        # carga entre shards y detectar uno caliente.
        metricas-por-shard: [IncomingRecords, OutgoingRecords, IteratorAgeMilliseconds]
        justificacion: >-
          Flujo de negocio critico y de volumen moderado. 3 shards para
          paralelismo entre instancias y holgura ante picos. Retencion de 24 h
          (lo ideal serian 7 dias para reprocesar la semana, pero el Learner
          Lab bloquea extenderla). La clave pedidoId garantiza el orden de los
          eventos de cada pedido y reparte bien la carga.

      # === 2. ACTIVIDAD: interacciones del cliente con el menu ==============
      - id: actividad
        nombre: pedido360-actividad
        modo-capacidad: PROVISIONED
        # Mismo numero de shards: es el flujo de mas volumen (cada clic es un
        # evento) y llega en rafagas; 3 shards absorben los picos de la hora
        # de almuerzo sin throttling.
        shards: 3
        # 24 horas, el minimo (y sin costo extra de retencion extendida). Una
        # tendencia de hace dos dias no sirve: el valor de este flujo caduca
        # rapido.
        retencion-horas: 24
        clave-particion: sesionId
        metricas-por-shard: [IncomingRecords, OutgoingRecords]
        justificacion: >-
          Flujo de alto volumen y bajo valor individual. Retencion minima (24 h)
          porque la informacion caduca rapido. La clave sesionId ordena los
          eventos de cada visita y, por su alta cardinalidad, evita shards
          calientes (productoId concentraria los productos populares).

      # === 3. FALLIDOS: dead letter stream ===================================
      - id: fallidos
        nombre: pedido360-fallidos
        modo-capacidad: PROVISIONED
        # 1 shard: solo recibe lo que falla, que debe ser excepcional. 1 MB/s
        # de escritura sobra.
        shards: 1
        # 24 horas por la misma restriccion del Learner Lab (lo ideal serian 7
        # dias, para tener tiempo de diagnosticar y reprocesar un fallido).
        retencion-horas: 24
        clave-particion: aplicacion
        metricas-por-shard: []
        justificacion: >-
          Destino de los eventos que una aplicacion no pudo procesar, con su
          causa y su contenido original. Un shard basta. Retencion de 24 h
          (lo ideal serian 7 dias; el Learner Lab no permite extenderla).

    # -----------------------------------------------------------------------
    # Aplicaciones consumidoras (consumer groups)
    # -----------------------------------------------------------------------
    # Se ejecutan en streaming-service. Cada una tiene su propia tabla de
    # coordinacion en DynamoDB, con el mismo nombre: una fila (lease) por shard
    # con su duenio (leaseOwner) y su checkpoint.
    aplicaciones:
      - nombre: pedido360-tablero-ventas
        stream: pedidos
        justificacion: >-
          Analitica de ventas en linea. Lee todos los eventos de pedidos a su
          propio ritmo.
      - nombre: pedido360-seguimiento-cocina
        stream: pedidos
        justificacion: >-
          Mide los tiempos de cada etapa y detecta pedidos atrasados. Es otra
          aplicacion sobre el mismo stream: su checkpoint es independiente, asi
          que si una se atrasa la otra no se ve afectada.
      - nombre: pedido360-tendencias-menu
        stream: actividad
        justificacion: Ranking de productos y busquedas de la ultima hora.

    # Instancias de streaming-service, para reenviarles las fallas inducidas y
    # juntar lo que cada una esta consumiendo.
    consumidores:
      instancias:
        - http://localhost:8083
        - http://localhost:8084

    # Estado derivado de los eventos y marcas de idempotencia (lo usa
    # streaming-service). On-Demand: el volumen es bajo e irregular.
    tabla-estado:
      nombre: pedido360-streaming-estado
      atributo-ttl: expiraEn

    # -----------------------------------------------------------------------
    # Alarma de retraso de consumo
    # -----------------------------------------------------------------------
    # GetRecords.IteratorAgeMilliseconds = edad del registro mas viejo leido.
    # Si crece, los consumidores no dan abasto o estan detenidos; si llegara a
    # la retencion, se perderian eventos sin haberlos procesado.
    alarma:
      nombre: pedido360-pedidos-retraso-consumo
      stream: pedidos
      metrica: GetRecords.IteratorAgeMilliseconds
      # 1 minuto de retraso ya es anomalo para un flujo casi en tiempo real.
      umbral-ms: 60000
      periodo-segundos: 60
      periodos-evaluacion: 3
      # 2 de 3 minutos sobre el umbral: evita falsas alarmas por un pico.
      datapoints-para-alarma: 2
      # Sin datos = nadie esta leyendo (la metrica solo se emite cuando hay
      # GetRecords). Eso tambien es un problema, asi que cuenta como alarma.
      sin-datos: breaching

logging:
  level:
    com.pedidos360.admin: INFO
    software.amazon.awssdk: WARN
